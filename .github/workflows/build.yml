      - name: Configure Android biometric permission
        run: |
          cd pintji_pay
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permission = '    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n'
          if 'android.permission.USE_BIOMETRIC' not in s:
              s = s.replace(marker, marker + '\n' + permission)
          p.write_text(s)
          PY

      - name: Build release APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd pintji_pay
          flutter build apk --release \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pintji-pay-v04-security
          path: pintji_pay/build/app/outputs/flutter-apk/app-release.apk

