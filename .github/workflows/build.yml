
name: Build PINTJI PAY APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create \
            --org com.pintjipay \
            --project-name pintji_pay \
            --platforms android \
            pintji_pay

      - name: Install PINTJI PAY source
        run: cp app_main.dart pintji_pay/lib/main.dart

      - name: Set application name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="PINTJI PAY"/' \
            pintji_pay/android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: |
          cd pintji_pay
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PINTJI-PAY-APK
          path: pintji_pay/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
