

name: PINTJI PAY v0.4 Security

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter app
        run: |
          flutter create --platforms=android pintji_pay
          cd pintji_pay
          flutter pub add supabase_flutter
          flutter pub add local_auth

      - name: Create PINTJI PAY v0.4
        run: |
          cd pintji_pay
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter/widgets.dart';
          import 'package:local_auth/local_auth.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';

          const supabaseUrl =
              'https://mnzkwajngdkwrylammqj.supabase.co';

          bool supabaseReady = false;

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            const key = String.fromEnvironment(
              'SUPABASE_PUBLISHABLE_KEY',
            );

            if (key.isNotEmpty) {
              try {
                await Supabase.initialize(
                  url: supabaseUrl,
                  anonKey: key,
                );
                supabaseReady = true;
              } catch (_) {}
            }

            runApp(const PintjiApp());
          }

          class PintjiApp extends StatelessWidget {
            const PintjiApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PINTJI PAY',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF1769FF),
                  ),
                  useMaterial3: true,
                ),
                home: const AuthGate(),
              );
            }
          }

          class AuthGate extends StatelessWidget {
            const AuthGate({super.key});

            @override
            Widget build(BuildContext context) {
              if (!supabaseReady) {
                return const LoginPage();
              }

              return StreamBuilder<AuthState>(
                stream: Supabase.instance.client.auth.onAuthStateChange,
                builder: (context, snapshot) {
                  final user =
                      Supabase.instance.client.auth.currentUser;
                  if (user == null) return const LoginPage();
                  return const MainPage();
                },
              );
            }
          }

          class LoginPage extends StatefulWidget {
            const LoginPage({super.key});

            @override
            State<LoginPage> createState() => _LoginPageState();
          }

          class _LoginPageState extends State<LoginPage> {
            final email = TextEditingController();
            final password = TextEditingController();
            final name = TextEditingController();
            bool register = false;
            bool busy = false;
            bool hidePassword = true;
            String notice = '';

            Future<void> submit() async {
              if (!supabaseReady) {
                setState(() {
                  notice = 'Supabase belum dikonfigurasi. '
                      'Periksa GitHub Actions secret.';
                });
                return;
              }

              if (email.text.trim().isEmpty ||
                  password.text.length < 8) {
                setState(() {
                  notice = 'Masukkan email dan password minimal 8 karakter.';
                });
                return;
              }

              setState(() {
                busy = true;
                notice = '';
              });

              try {
                final auth = Supabase.instance.client.auth;

                if (register) {
                  await auth.signUp(
                    email: email.text.trim(),
                    password: password.text,
                    data: {
                      'display_name': name.text.trim(),
                    },
                  );
                  if (mounted) {
                    setState(() {
                      notice = 'Pendaftaran dikirim. '
                          'Jika verifikasi email aktif, cek email kamu.';
                    });
                  }
                } else {
                  await auth.signInWithPassword(
                    email: email.text.trim(),
                    password: password.text,
                  );
                }
              } on AuthException catch (e) {
                if (mounted) {
                  setState(() => notice = e.message);
                }
              } catch (_) {
                if (mounted) {
                  setState(() => notice = 'Terjadi kesalahan. Coba lagi.');
                }
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

            @override
            void dispose() {
              email.dispose();
              password.dispose();
              name.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: ConstrainedBox(
                      constraints: const BoxConstraints(maxWidth: 420),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          const Icon(
                            Icons.shield_moon,
                            size: 64,
                            color: Color(0xFF1769FF),
                          ),
                          const SizedBox(height: 12),
                          const Text(
                            'PINTJI PAY',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              fontSize: 28,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const Text(
                            'v0.4 • Account Security',
                            textAlign: TextAlign.center,
                          ),
                          const SizedBox(height: 28),
                          if (!supabaseReady)
                            const Card(
                              child: Padding(
                                padding: EdgeInsets.all(12),
                                child: Text(
                                  'Supabase belum siap. Login sungguhan '
                                  'memerlukan publishable key di GitHub '
                                  'Actions Secrets.',
                                ),
                              ),
                            ),
                          if (register)
                            TextField(
                              controller: name,
                              decoration: const InputDecoration(
                                labelText: 'Nama tampilan',
                                prefixIcon: Icon(Icons.person_outline),
                              ),
                            ),
                          const SizedBox(height: 12),
                          TextField(
                            controller: email,
                            keyboardType: TextInputType.emailAddress,
                            decoration: const InputDecoration(
                              labelText: 'Email',
                              prefixIcon: Icon(Icons.email_outlined),
                              border: OutlineInputBorder(),
                            ),
                          ),
                          const SizedBox(height: 12),
                          TextField(
                            controller: password,
                            obscureText: hidePassword,
                            decoration: InputDecoration(
                              labelText: 'Password (minimal 8 karakter)',
                              prefixIcon: const Icon(Icons.lock_outline),
                              border: const OutlineInputBorder(),
                              suffixIcon: IconButton(
                                onPressed: () => setState(
                                  () => hidePassword = !hidePassword,
                                ),
                                icon: Icon(
                                  hidePassword
                                      ? Icons.visibility
                                      : Icons.visibility_off,
                                ),
                              ),
                            ),
                          ),
                          const SizedBox(height: 16),
                          FilledButton(
                            onPressed: busy ? null : submit,
                            child: Text(
                              busy
                                  ? 'Memproses...'
                                  : register ? 'Daftar akun' : 'Login',
                            ),
                          ),
                          TextButton(
                            onPressed: busy
                                ? null
                                : () => setState(() {
                                      register = !register;
                                      notice = '';
                                    }),
                            child: Text(
                              register
                                  ? 'Sudah punya akun? Login'
                                  : 'Belum punya akun? Daftar',
                            ),
                          ),
                          if (notice.isNotEmpty)
                            Padding(
                              padding: const EdgeInsets.only(top: 8),
                              child: Text(
                                notice,
                                textAlign: TextAlign.center,
                              ),
                            ),
                          const SizedBox(height: 12),
                          const Text(
                            'Demo produk digital. Tidak memproses '
                            'uang sungguhan.',
                            textAlign: TextAlign.center,
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class Product {
            Product(this.name, this.category, this.price);
            final String name;
            final String category;
            final int price;
          }

          class MainPage extends StatefulWidget {
            const MainPage({super.key});

            @override
            State<MainPage> createState() => _MainPageState();
          }

          class _MainPageState extends State<MainPage>
              with WidgetsBindingObserver {
            int tab = 0;
            String category = 'Semua';
            String query = '';
            bool locked = false;
            bool hideBalance = true;
            bool biometricAvailable = false;
            bool checkingBiometric = false;

            final auth = LocalAuthentication();
            final orders = <String>[];
            final complaints = <String>[];
            final products = <Product>[
              Product('Pulsa 10.000', 'Pulsa', 10000),
              Product('Paket Data Demo', 'Data', 15000),
              Product('Voucher Game Demo', 'Game', 20000),
            ];

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              checkBiometric();
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.inactive ||
                  state == AppLifecycleState.paused ||
                  state == AppLifecycleState.hidden) {
                if (mounted) setState(() => locked = true);
              }
            }

            Future<void> checkBiometric() async {
              try {
                final can = await auth.canCheckBiometrics;
                final supported = await auth.isDeviceSupported();
                if (mounted) {
                  setState(() {
                    biometricAvailable = can && supported;
                  });
                }
              } catch (_) {
                if (mounted) {
                  setState(() => biometricAvailable = false);
                }
              }
            }

            Future<void> unlock() async {
              if (checkingBiometric) return;
              setState(() => checkingBiometric = true);
              try {
                final ok = await auth.authenticate(
                  localizedReason: 'Buka kunci PINTJI PAY',
                  options: const AuthenticationOptions(
                    biometricOnly: true,
                    stickyAuth: true,
                  ),
                );
                if (mounted && ok) setState(() => locked = false);
              } on PlatformException {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text(
                        'Biometrik gagal atau tidak tersedia di perangkat.',
                      ),
                    ),
                  );
                }
              } finally {
                if (mounted) setState(() => checkingBiometric = false);
              }
            }

            Future<List<Product>> loadProducts() async {
              if (!supabaseReady) return products;
              final rows = await Supabase.instance.client
                  .from('products')
                  .select('name, category, price')
                  .eq('is_active', true);

              return rows.map<Product>((row) => Product(
                row['name'] as String,
                row['category'] as String,
                (row['price'] as num).toInt(),
              )).toList();
            }

            String rupiah(int value) {
              final s = value.toString();
              final out = StringBuffer();
              for (var i = 0; i < s.length; i++) {
                if (i > 0 && (s.length - i) % 3 == 0) {
                  out.write('.');
                }
                out.write(s[i]);
              }
              return 'Rp$out';
            }

            void message(String text) {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(text)),
              );
            }

            Future<void> logout() async {
              if (supabaseReady) {
                await Supabase.instance.client.auth.signOut();
              }
            }

            @override
            Widget build(BuildContext context) {
              if (locked) {
                return Scaffold(
                  body: Center(
                    child: Padding(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Icon(
                            Icons.lock,
                            size: 72,
                            color: Color(0xFF1769FF),
                          ),
                          const SizedBox(height: 16),
                          const Text(
                            'PINTJI PAY terkunci',
                            style: TextStyle(
                              fontSize: 24,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 8),
                          const Text(
                            'Autentikasi perangkat diperlukan untuk '
                            'membuka layar aplikasi lagi.',
                            textAlign: TextAlign.center,
                          ),
                          const SizedBox(height: 20),
                          if (biometricAvailable)
                            FilledButton.icon(
                              onPressed: checkingBiometric ? null : unlock,
                              icon: const Icon(Icons.fingerprint),
                              label: Text(
                                checkingBiometric
                                    ? 'Memeriksa...'
                                    : 'Buka dengan biometrik',
                              ),
                            )
                          else
                            const Text(
                              'Biometrik tidak tersedia. Tutup aplikasi '
                              'dan login kembali untuk memulai sesi baru.',
                              textAlign: TextAlign.center,
                            ),
                          TextButton(
                            onPressed: logout,
                            child: const Text('Logout akun'),
                          ),
                        ],
                      ),
                    ),
                  ),
                );
              }

              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'PINTJI PAY',
                    style: TextStyle(fontWeight: FontWeight.bold),
                  ),
                  actions: [
                    IconButton(
                      tooltip: 'Profil dan logout',
                      onPressed: () => showModalBottomSheet<void>(
                        context: context,
                        builder: (ctx) => SafeArea(
                          child: ListTile(
                            leading: const Icon(Icons.person_outline),
                            title: Text(
                              supabaseReady
                                  ? Supabase.instance.client.auth.currentUser
                                          ?.email ??
                                      'Akun demo'
                                  : 'Mode demo',
                            ),
                            subtitle: const Text('Akun PINTJI PAY'),
                          ),
                        ),
                      ),
                      icon: const Icon(Icons.account_circle_outlined),
                    ),
                    IconButton(
                      tooltip: 'Logout',
                      onPressed: logout,
                      icon: const Icon(Icons.logout),
                    ),
                  ],
                ),
                body: IndexedStack(
                  index: tab,
                  children: [
                    home(),
                    catalog(),
                    orderPage(),
                    sellerPage(),
                    complaintPage(),
                    securit
